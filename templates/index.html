<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Điều khiển LED & Giám sát DHT</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      text-align: center;
      margin-top: 50px;
    }
    .container {
      display: inline-block;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 { color: #333; }
    .temp {
      font-size: 24px;
      margin: 15px 0;
      color: #007bff;
    }
    button {
      font-size: 18px;
      padding: 10px 30px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .on {
      background-color: #28a745;
      color: white;
    }
    .off {
      background-color: #dc3545;
      color: white;
    }
    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💡 Điều khiển LED & Cảm biến DHT</h1>
    <div class="temp">🌡️ Nhiệt độ hiện tại: <b>{{ temp }}</b> °C</div>
    <div>
      <a href="/set_led/ON"><button class="on">BẬT LED</button></a>
      <a href="/set_led/OFF"><button class="off">TẮT LED</button></a>
    </div>
    <p>Trạng thái LED: <b>{{ led }}</b></p>
  </div>
</body>
</html>
